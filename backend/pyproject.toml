[project]
name = "varshiq-backend"
version = "0.1.0"
description = "Explainable urban rainwater intelligence and property WaterTwin"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.40,<1", "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.44,<3", "alembic>=1.17,<2", "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.18,<1", "shapely>=2.1,<3", "pyproj>=3.7,<4",
  "httpx>=0.28,<1", "argon2-cffi>=25.1,<26", "python-multipart>=0.0.22,<1",
  "email-validator>=2.3,<3", "reportlab>=4.4,<5", "pillow>=13,<14", "tzdata>=2025.2", "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
historical = ["imdlib>=0.1", "xarray>=2025.1", "pandas>=2.2", "pyarrow>=20", "netcdf4>=1.7"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
