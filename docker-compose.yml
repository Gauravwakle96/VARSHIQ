name: varshiq
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: varshiq
      POSTGRES_USER: varshiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varshiq -d varshiq"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    # PostgreSQL is intentionally not published to the host.

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://varshiq:${POSTGRES_PASSWORD}@db:5432/varshiq
      SERVER_SECRET: ${SERVER_SECRET:?Set a random SERVER_SECRET in the ignored .env file}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      PILOT_LOCALITY: ${PILOT_LOCALITY:-Chhatrapati Sambhajinagar}
      PILOT_LATITUDE: ${PILOT_LATITUDE:-19.8762}
      PILOT_LONGITUDE: ${PILOT_LONGITUDE:-75.3433}
      PILOT_TIMEZONE: ${PILOT_TIMEZONE:-Asia/Kolkata}
      OPEN_METEO_ENABLED: ${OPEN_METEO_ENABLED:-true}
      OPEN_METEO_COMMERCIAL: ${OPEN_METEO_COMMERCIAL:-false}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      FORECAST_CACHE_MINUTES: ${FORECAST_CACHE_MINUTES:-30}
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-1800}
      RAIN_EVENT_DRY_GAP_HOURS: ${RAIN_EVENT_DRY_GAP_HOURS:-6}
      OSM_ENABLED: ${OSM_ENABLED:-true}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      GEOCODING_ENABLED: ${GEOCODING_ENABLED:-true}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-photon}
      GEOCODING_BASE_URL: ${GEOCODING_BASE_URL:-}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-VARSHIQ/0.1 (https://github.com/Gauravwakle96/VARSHIQ)}
      GEOCODING_NOMINATIM_POLICY_ACCEPTED: ${GEOCODING_NOMINATIM_POLICY_ACCEPTED:-false}
      MICROSOFT_ENABLED: ${MICROSOFT_ENABLED:-false}
      MICROSOFT_INDEX_URL: ${MICROSOFT_INDEX_URL:-https://bfppub.blob.core.windows.net/%24web/2026-08-13/dataset-links.csv}
      MICROSOFT_TILE_MAX_BYTES: ${MICROSOFT_TILE_MAX_BYTES:-52428800}
      IMD_ENABLED: ${IMD_ENABLED:-false}
      IMD_REQUEST_HEADERS: ${IMD_REQUEST_HEADERS:-{}}
      IMD_APPROVED_DATA_DIR: ${IMD_APPROVED_DATA_DIR:-}
      IMD_DATA_TERMS_ACCEPTED: ${IMD_DATA_TERMS_ACCEPTED:-false}
      GOBS_ENABLED: ${GOBS_ENABLED:-false}
      GROUNDWATER_APPROVED_FILE: ${GROUNDWATER_APPROVED_FILE:-}
      SOIL_APPROVED_FILE: ${SOIL_APPROVED_FILE:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
    volumes:
      - application-data:/app/backend/data
      - property-photos:/app/backend/uploads
    expose: ["8000"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
    networks: [internal, outbound]

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [internal, outbound]

volumes:
  postgres-data:
  application-data:
  property-photos:

networks:
  internal:
    internal: true
  outbound:
